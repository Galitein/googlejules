<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <link rel="icon" href="../assets/icon.svg">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top-bar">
        <div class="tabs">
            <button id="dashboard-tab-btn" class="tab-btn active">Dashboard</button>
            <button id="tasks-tab-btn" class="tab-btn">Tasks</button>
            <button id="meeting-notes-tab-btn" class="tab-btn">Meeting Notes</button>
        </div>
    </div>

    <div class="content-area">
        <!-- Dashboard View -->
        <div id="dashboard-view" class="view">
            <div class="dashboard-widgets">
                <button class="dashboard-widget" id="widget-tasks">
                    <span class="widget-icon">📝</span>
                    <span class="widget-title">Tasks</span>
                </button>
                <button class="dashboard-widget" id="widget-meeting-notes">
                    <span class="widget-icon">📅</span>
                    <span class="widget-title">Meeting Notes</span>
                </button>
            </div>
        </div>

        <!-- Meeting Notes View -->
        <div id="meeting-notes-view" class="view" style="display: none;">
            <div class="container">
                <div class="sidebar" id="meeting-notes-sidebar">
                    <div class="sidebar-header">
                        <h2>Folders</h2>
                        <button id="new-folder-btn" class="btn-icon" title="New Root Folder">➕</button>
                    </div>
                    <div id="folder-tree-container">
                        <!-- Folder tree will be dynamically inserted here -->
                    </div>
                </div>
                <div class="main-content">
                    <div id="notes-list-container">
                        <h1>Select a folder to see notes</h1>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tasks View -->
        <div id="tasks-view" class="view" style="display: none;">
            <div class="container">
                <!-- Left Sidebar for Tags -->
                <div class="sidebar">
                    <h2>Tags</h2>
                    <button id="all-tasks-btn" class="tag-btn active">All Tasks</button>
                    <input type="search" id="tag-search-input" placeholder="Search tags...">
                    <ul id="tags-list">
                        <!-- Tags will be dynamically inserted here -->
                    </ul>
                </div>

                <!-- Main Content for Tasks -->
                <div class="main-content">
                    <div class="header">
                        <h1>Tasks</h1>
                        <div class="header-controls">
                            <input type="search" id="task-search-input" placeholder="Search tasks by title or tag...">
                            <button id="new-task-btn" class="btn-primary">New Task</button>
                        </div>
                    </div>
                    <div id="task-list">
                        <!-- Tasks will be dynamically inserted here -->
                    </div>
                    <div id="pagination-container">
                        <!-- Pagination controls will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Task Edit/Create Modal (hidden by default) -->
    <div id="task-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title">New Task</h2>
            <form id="task-form">
                <input type="hidden" id="task-id-input">
                <div class="form-group">
                    <label for="task-title-input">Title</label>
                    <input type="text" id="task-title-input" required>
                </div>
                <div class="form-group">
                    <label for="task-tags-input">Tags</label>
                    <div class="tag-input-container" id="tag-input-container">
                        <input type="text" id="task-tags-input" placeholder="Add a tag...">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Prompt Modal -->
    <div id="prompt-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="prompt-title">Enter Name</h2>
            <form id="prompt-form">
                <div class="form-group">
                    <input type="text" id="prompt-input" required>
                </div>
                <div class="form-actions">
                    <button type="button" id="prompt-cancel-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">OK</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Renderer Script -->
    <script src="../dist/renderer.js"></script>
</body>
</html>
